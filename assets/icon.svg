<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- Container body -->
  <rect x="232" y="340" width="560" height="380" rx="40" fill="none" stroke="url(#accent)" stroke-width="36"/>
  <!-- Container top rim / lid -->
  <rect x="200" y="300" width="624" height="76" rx="20" fill="url(#accent)" opacity="0.15"/>
  <rect x="200" y="300" width="624" height="76" rx="20" fill="none" stroke="url(#accent)" stroke-width="36"/>
  <!-- Handle on top -->
  <rect x="432" y="220" width="160" height="80" rx="16" fill="none" stroke="url(#accent)" stroke-width="32"/>
  <!-- Three container blocks inside (like Docker layers) -->
  <rect x="300" y="430" width="130" height="80" rx="12" fill="url(#accent)" opacity="0.25"/>
  <rect x="448" y="430" width="130" height="80" rx="12" fill="url(#accent)" opacity="0.25"/>
  <rect x="596" y="430" width="130" height="80" rx="12" fill="url(#accent)" opacity="0.25"/>
  <rect x="300" y="530" width="130" height="80" rx="12" fill="url(#accent)" opacity="0.15"/>
  <rect x="448" y="530" width="130" height="80" rx="12" fill="url(#accent)" opacity="0.15"/>
  <rect x="596" y="530" width="130" height="80" rx="12" fill="url(#accent)" opacity="0.15"/>
  <!-- Green status dot -->
  <circle cx="806" cy="260" r="48" fill="url(#green)"/>
  <circle cx="806" cy="260" r="48" fill="none" stroke="#0e1116" stroke-width="16"/>
</svg>
